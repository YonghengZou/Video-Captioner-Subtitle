[project]
name = "video-captioner-subtitle"
version = "0.1.0"
description = "Subtitle generation, correction, translation and burning pipeline for videos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
align = ["whisperx"]

[project.scripts]
video-captioner-subtitle = "video_captioner_subtitle:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
